# Two images, one service each:
#
#   standalone  mr-radio-localization:jazzy-standalone  (Dockerfile)
#       The localization stack only, FROM osrf/ros:jazzy-desktop -- for
#       running against your own rosbags. No simulator, no UWBPX4Sim.
#   sim         mr-radio-localization:jazzy-sim         (Dockerfile.sim)
#       FROM the UWBPX4Sim image (PX4 SITL + Gazebo + UWB plugin), adding
#       the localization stack on top.
#
# To build (or launch) either: ./setup.sh (standalone, the default) or
# ./setup.sh --sim. It wraps `docker compose build`, tells you about any
# existing image, checks disk space, and starts/reattaches a persistent
# container -- see setup.sh --help.
#
# Usage by hand (from this docker/ directory, Linux host with an X server):
#   xhost +local:docker                           # allow the container to reach your X server (once per host session)
#   d="${DISPLAY#*:}"; chmod 777 "/tmp/.X11-unix/X${d%%.*}"   # see note below -- needed on Wayland/XWayland hosts
#   docker compose run --build --rm standalone               # standalone menu
#   docker compose run --service-ports --build --rm sim      # SITL menu (needs uwbpx4sim:jazzy built first)
#   docker compose run --rm standalone bash                  # skip the menu, open a shell
#
# The chmod is a separate, extra requirement on Wayland/XWayland desktops (GNOME/GDM and others)
# Classic Xorg sessions (no Wayland) are usually already 777 and don't need
# this at all -- if `xhost` alone works, skip the chmod.
#
# `docker compose run` (unlike `up`) does not publish a service's `ports:`
# unless you pass --service-ports -- without it, setup_simulator.sh's
# configuration GUI (option 1 in the sim menu) starts fine inside the
# container but is unreachable from the host browser.
#
# --rm avoids leaving stopped containers behind between runs.
#
# UWBPX4SIM_DIR (sim only): host path of your UWBPX4Sim checkout (a
# separate repository, not a submodule of this one). setup.sh --sim sets
# and exports it -- defaulting to a sibling of this repo, i.e.
# <ros_ws>/src/UWBPX4Sim, and cloning it there if missing. When calling
# `docker compose` by hand, the same default applies (relative paths
# resolve against this docker/ directory), or export UWBPX4SIM_DIR yourself.
#
# Under WSL2, layer on the GPU override as well (setup.sh does this
# automatically when it detects WSL):
#   docker compose -f docker-compose.yml -f docker-compose.wsl.yml run ...

# Explicit project name: both this repo and UWBPX4Sim keep their compose file
# in a directory called docker/, which compose would otherwise use as the
# project name for both -- making each one see the other's containers as
# "orphans" (and `--remove-orphans` delete them).
name: mr-radio-localization

# Settings both services share.
x-common: &common
  stdin_open: true
  tty: true

services:
  standalone:
    <<: *common
    build:
      # The repository root: the images COPY this checkout (see the
      # .dockerignore there).
      context: ..
      dockerfile: docker/Dockerfile
    image: mr-radio-localization:jazzy-standalone
    # No NVIDIA-specific settings here, unlike `sim`: RViz renders fine in
    # software, and this image shouldn't require nvidia-container-toolkit.
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      # This whole repository from the host, mounted over the copy the image
      # cloned and built at ~/ros2_ws/src/mr-radio-localization -- same as
      # UWBPX4Sim's own compose file. The image builds with --symlink-install,
      # so the installed config/ and launch/ files are links into this source
      # tree, and the installed bags/ is a link to the source bags/ folder:
      # edits on the host (parameters, launch files) and newly dropped-in
      # bags are live without any rebuild. C++ changes need a rebuild inside
      # the container (menu option "Rebuild uwb_localization"), not a new image.
      - ..:/home/jazzy/ros2_ws/src/mr-radio-localization
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  sim:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.sim
    image: mr-radio-localization:jazzy-sim
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - UWB_GUI_PORT=${UWB_GUI_PORT:-5050}
      # GPU rendering for Gazebo
      - NVIDIA_DRIVER_CAPABILITIES=all
      # NVIDIA PRIME "on-demand" hosts (`prime-select query`): the Intel
      # iGPU renders by default and apps only use the NVIDIA GPU when they
      # explicitly ask via these vars.
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __VK_LAYER_NV_optimus=NVIDIA_only
    ports:
      # setup_simulator.sh's browser-based configuration GUI (gui/app.py).
      # Passed into the container via UWB_GUI_PORT above too, so overriding
      # it on the host changes both what's published and what the GUI binds to.
      - "${UWB_GUI_PORT:-5050}:${UWB_GUI_PORT:-5050}"
    volumes:
      # The whole UWBPX4Sim checkout from the host (see UWBPX4SIM_DIR in
      # the header), mounted over the copy baked into the base image at
      # ~/ros2_ws/src/UWBPX4Sim -- same as UWBPX4Sim's own compose file.
      # Mounting the whole repo (not a handful of subdirs) keeps the
      # scripts, tools, models, plugin and configs all from one version,
      # whatever version you have checked out on the host.
      - ${UWBPX4SIM_DIR:-../../UWBPX4Sim}:/home/jazzy/ros2_ws/src/UWBPX4Sim
      # Mounted onto the installed path, not the source tree
      - ${UWBPX4SIM_DIR:-../../UWBPX4Sim}/ROS2/px4_sim_offboard/trajectories:/home/jazzy/ros2_ws/install/px4_sim_offboard/share/px4_sim_offboard/trajectories
      # Same as the standalone service: this repository over the image's copy.
      - ..:/home/jazzy/ros2_ws/src/mr-radio-localization
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # NVIDIA GPU passthrough for Gazebo rendering (needs the host's NVIDIA
    # driver + nvidia-container-toolkit installed)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
